<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisualCrafting 1.7.2 GUI Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#343a40,#111315 60%);color:#eee;font:14px system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(1180px,96vw);height:min(760px,92vh);min-height:620px;background:#151719;border:2px solid #4b5258;border-radius:8px;box-shadow:0 20px 55px #0009;display:grid;grid-template-columns:205px 1fr;overflow:hidden}.side{background:#191c1f;border-right:1px solid #3b4248;padding:14px 11px;display:flex;flex-direction:column}.brand{display:flex;gap:9px;align-items:center;padding:6px 7px 16px;border-bottom:1px solid #343a3f;margin-bottom:10px}.logo{width:34px;height:34px;border:2px solid #94e9ab;background:#3c8652;color:#07120a;display:grid;place-items:center;font-weight:900;border-radius:5px}.brand b{font-size:14px}.brand small{display:block;color:#8e969c;font-size:10px;margin-top:2px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:1px solid transparent;background:0;color:#c5cbd0;text-align:left;padding:8px;border-radius:5px;cursor:pointer;display:flex;gap:9px;align-items:center}.nav button:hover{background:#252a2e}.nav button.on{background:#294533;border-color:#4f805f;color:#fff;box-shadow:inset 3px 0 #75e391}.ico{width:24px;height:24px;display:grid;place-items:center;background:#2b3035;border:1px solid #484f55;border-radius:4px}.foot{margin-top:auto;color:#697178;font-size:10px;padding:10px 6px}.main{display:grid;grid-template-rows:61px 1fr 62px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:0 20px;background:linear-gradient(#22262a,#1c1f22);border-bottom:1px solid #3c4349}.top h1{font-size:18px;margin:0}.top p{font-size:11px;color:#899197;margin:3px 0}.pill{padding:5px 9px;background:#252b2f;border:1px solid #444c52;border-radius:99px;font-size:10px;margin-left:5px}.ok{color:#91e5a7;border-color:#3b6c4b}.content{padding:18px;overflow:auto}.hero{display:flex;justify-content:space-between;margin-bottom:14px}.hero h2{font-size:20px;margin:0 0 3px}.hero p{font-size:11px;color:#929aa0;margin:0}.version{font-size:10px;color:#bfc5c9;padding:6px 9px;border:1px solid #454c52;background:#282d31;border-radius:4px;height:max-content}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:11px}.card{background:linear-gradient(#262b30,#202428);border:1px solid #42494f;border-radius:6px;padding:13px;box-shadow:inset 0 1px #fff1}.w4{grid-column:span 4}.w6{grid-column:span 6}.w8{grid-column:span 8}.w12{grid-column:span 12}.card h3{font-size:12px;margin:0 0 10px}.field{margin:7px 0}.field label{display:block;color:#a8b0b6;font-size:10px;margin-bottom:4px}.input{height:33px;padding:7px 9px;background:#15181a;border:1px solid #4a5258;border-radius:4px;display:flex;align-items:center;justify-content:space-between}.input:after{content:"⌄";color:#7d878e}.slots{display:grid;grid-template-columns:repeat(3,52px);gap:7px;justify-content:center}.slot{height:52px;background:linear-gradient(145deg,#30363b,#1b1e21);border:2px solid #111;outline:1px solid #50575d;border-radius:3px;display:grid;place-items:center;font-size:23px;position:relative}.slot small{position:absolute;right:2px;bottom:0;font-size:9px}.preview{background:#171a1c;border:1px solid #3e464c;border-radius:5px;padding:11px;text-align:center}.big{font-size:38px}.preview b{display:block}.preview span{font-size:10px;color:#8b959c}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.btn{height:33px;border:1px solid #596168;background:linear-gradient(#3b4248,#2b3035);color:#eee;border-radius:4px;padding:0 12px;cursor:pointer;font-weight:600}.btn:hover{filter:brightness(1.12)}.primary{background:linear-gradient(#4c9d63,#326d45);border-color:#76b98b}.danger{background:linear-gradient(#884f4f,#633939);border-color:#a66b6b}.table{border:1px solid #41484e;border-radius:5px;overflow:hidden}.tr{display:grid;grid-template-columns:1.25fr .8fr 1.25fr .7fr;min-height:42px;align-items:center;padding:0 9px;border-bottom:1px solid #363c41}.tr:last-child{border:0}.head{background:#171a1c;color:#89939a;font-size:10px}.tr:not(.head):hover{background:#2b3035}.mini{width:27px;height:27px;display:grid;place-items:center;background:#16191b;border:1px solid #535b62;border-radius:3px}.item{display:flex;gap:7px;align-items:center}.tag{font-size:9px;padding:3px 6px;border-radius:3px;background:#30363b;border:1px solid #4a5157}.green{background:#203529;border-color:#3b714d;color:#91e3a9}.gold{background:#3b3321;border-color:#756134;color:#efd07b}.range{height:7px;background:#111;border:1px solid #454c52;border-radius:99px;overflow:hidden}.range i{display:block;height:100%;width:62%;background:#60c77c}.notice{padding:8px 10px;background:#1c2d22;border-left:3px solid #62cf80;color:#b6d8be;font-size:10px;margin-top:10px}.bottom{display:flex;align-items:center;justify-content:space-between;padding:0 19px;background:#1b1e21;border-top:1px solid #3c4349}.hint{font-size:10px;color:#788188}.actions{display:flex;gap:7px}.mode{display:none}.mode.on{display:block}@media(max-width:800px){.app{grid-template-columns:65px}.brand b,.brand small,.nav span,.foot{display:none}.brand{justify-content:center}.nav button{justify-content:center}.w4,.w6,.w8{grid-column:span 12}}
</style><div class="app"><aside class="side"><div class="brand"><div class="logo">VC</div><div><b>VisualCrafting</b><small>1.7.2 · GUI Preview</small></div></div><nav class="nav" id="nav"></nav><div class="foot">统一视觉规范<br>逻辑保持不变</div></aside><section class="main"><header class="top"><div><h1 id="title">合成</h1><p id="desc">可视化编辑物品合成与输出</p></div><div><span class="pill ok">● 已连接</span><span class="pill">Tier 3</span></div></header><main class="content" id="content"></main><footer class="bottom"><span class="hint">输入 → 配置 → 预览 → 操作</span><div class="actions"><button class="btn" onclick="toast('已刷新')">刷新</button><button class="btn primary" onclick="toast('示例：保存成功')">保存配置</button></div></footer></section></div><script>
const T=[['⚒','合成','可视化编辑物品合成与输出'],['✦','灌注','输入材料与化学品需求'],['◆','绿宝石','职业、等级与村民交易'],['⛏','矿物','维度、群系与生成范围'],['◈','食物','饥饿值、饱和度与药水效果'],['✎','命名牌','名称、Lore、颜色与字体'],['✚','创建物品','护甲、工具与饰品'],['⬢','物品增强','属性、附魔与耐久'],['⚙','更多','高级设置与兼容性']];
const nav=document.getElementById('nav');T.forEach((x,i)=>{let b=document.createElement('button');b.innerHTML='<i class="ico">'+x[0]+'</i><span>'+x[1]+'</span>';b.onclick=()=>show(i);nav.appendChild(b)});
const inp=(a,v)=>'<div class="field"><label>'+a+'</label><div class="input">'+v+'</div></div>';
function base(h,p,b){return '<div class="hero"><div><h2>'+h+'</h2><p>'+p+'</p></div><div class="version">VisualCrafting · 1.7.2</div></div>'+b}
function show(i){document.querySelectorAll('.nav button').forEach((b,n)=>b.classList.toggle('on',n===i));title.textContent=T[i][1];desc.textContent=T[i][2];let c=document.getElementById('content');
if(i===0)c.innerHTML=base('配方制作','输入区 → 输出区，减少空白与视觉跳跃','<div class="grid"><div class="card w8"><h3>配方输入</h3><div class="slots">'+['🪵','🪵',' ','⛏','🪨',' ',' ',' ',' '].map(x=>'<div class="slot">'+x+'<small>'+(x.trim()?'1':'')+'</small></div>').join('')+'</div><div class="notice">拖入物品即可设置输入；空槽位不会参与配方。</div></div><div class="card w4"><h3>输出预览</h3><div class="preview"><div class="big">⚔️</div><b>钻石剑</b><span>数量 ×1</span></div></div><div class="card w6"><h3>配方信息</h3>'+inp('配方类型','有序配方')+inp('配方 ID','visualcrafting:example_sword')+'</div><div class="card w6"><h3>操作</h3><div class="row"><button class="btn">清空</button><button class="btn">复制</button><button class="btn primary">保存配方</button></div></div></div>');
if(i===1)c.innerHTML=base('灌注 / 化学配方','输入、化学品、输出采用同一层级','<div class="grid"><div class="card w8"><h3>配方流程</h3><div class="row"><div class="preview"><div class="big">🪨</div><b>输入</b><span>×1</span></div><div>→</div><div class="preview"><div class="big">💧</div><b>化学品</b><span>100 mB</span></div><div>→</div><div class="preview"><div class="big">💎</div><b>输出</b><span>×1</span></div></div></div><div class="card w4"><h3>化学品</h3>'+inp('类型','Mekanism · 氢气')+inp('数量','100')+'</div><div class="card w6"><h3>参数</h3>'+inp('输入数量','1')+inp('输出数量','1')+'</div><div class="card w6"><h3>配方列表</h3><div class="table"><div class="tr head"><span>输入</span><span>化学品</span><span>输出</span><span>状态</span></div><div class="tr"><span>🪨 石头</span><span>100 mB</span><span>💎 钻石</span><span class="tag green">启用</span></div></div></div></div>');
if(i===2)c.innerHTML=base('村民交易','将职业、等级、交易和操作明确分区','<div class="grid"><div class="card w4"><h3>交易定位</h3>'+inp('职业','工具匠')+inp('等级','3 · 专家')+inp('交易条目','第 2 条')+'</div><div class="card w8"><h3>交易内容</h3><div class="table"><div class="tr head"><span>成本 1</span><span>成本 2</span><span>结果</span><span>最大次数</span></div><div class="tr"><span class="item"><i class="mini">💎</i>钻石 ×12</span><span class="item"><i class="mini">🪨</i>石头 ×4</span><span class="item"><i class="mini">⚒</i>钻石镐 ×1</span><span>12</span></div></div><div class="row" style="margin-top:9px">'+inp('经验值','2')+inp('价格倍率','0.05')+'</div></div><div class="card w12"><h3>交易管理</h3><div class="row"><button class="btn">← 上一条</button><button class="btn">下一条 →</button><button class="btn">新增交易</button><button class="btn danger">删除当前</button><button class="btn primary">保存交易</button></div></div></div>');
if(i===3)c.innerHTML=base('矿石生成','范围、产量、目标三组参数独立','<div class="grid"><div class="card w4"><h3>生成目标</h3>'+inp('维度','全部维度')+inp('群系','全部群系')+'</div><div class="card w8"><h3>生成范围</h3>'+inp('最低 Y','-63')+inp('最高 Y','319')+'<div class="field"><label>矿脉大小</label><div class="range"><i></i></div></div></div><div class="card w6"><h3>主矿物</h3><div class="preview"><div class="big">⛏️</div><b>钻石矿</b><span>数量 1–3 · 概率 50%</span></div></div><div class="card w6"><h3>副产物</h3><div class="preview"><div class="big">◈</div><b>深层钻石矿</b><span>数量 1–2 · 概率 50%</span></div></div></div>');
if(i===4)c.innerHTML=base('食物效果','基础属性 + 效果列表','<div class="grid"><div class="card w4"><h3>基础属性</h3>'+inp('饥饿值','4')+inp('饱和度','0.3')+inp('食用时间','0 秒')+'</div><div class="card w8"><h3>药水效果</h3><div class="table"><div class="tr head"><span>效果</span><span>等级</span><span>持续时间</span><span>概率</span></div><div class="tr"><span>速度</span><span>II</span><span>30 秒</span><span>100%</span></div><div class="tr"><span>力量</span><span>I</span><span>15 秒</span><span>25%</span></div></div><button class="btn" style="margin-top:9px">＋ 添加效果</button></div></div>');
if(i===5)c.innerHTML=base('名称与描述','编辑区与实时预览并列','<div class="grid"><div class="card w8"><h3>文本编辑</h3>'+inp('物品名称','传奇之剑')+inp('Lore 1','一把被时间祝福的武器')+inp('Lore 2','右键释放特殊能力')+'<div class="row"><button class="btn">颜色</button><button class="btn">粗体</button><button class="btn">斜体</button><button class="btn">彩虹</button></div></div><div class="card w4"><h3>实时预览</h3><div class="preview"><div class="big">🗡️</div><b style="color:#70e892">传奇之剑</b><span>一把被时间祝福的武器<br>右键释放特殊能力</span></div></div></div>');
if(i===6)c.innerHTML=base('创建物品','先选择类型，再显示对应参数','<div class="grid"><div class="card w4"><h3>物品类型</h3>'+inp('大类','护甲')+inp('子类型','胸甲')+'</div><div class="card w8"><h3>注册信息</h3>'+inp('显示名称','传奇胸甲')+inp('注册 ID','legendary_chestplate')+'<div class="row"><button class="btn">纹理</button><button class="btn">高级配置</button><button class="btn primary">生成物品</button></div></div></div>');
if(i===7)c.innerHTML=base('物品增强','属性、附魔、耐久分组；当前物品无关项隐藏','<div class="grid"><div class="card w6"><h3>属性</h3>'+inp('属性','攻击伤害')+inp('运算','增加')+inp('数值','5')+inp('装备槽','主手')+'</div><div class="card w6"><h3>附魔</h3>'+inp('附魔','锋利')+inp('等级','5')+'<button class="btn" style="width:100%">＋ 添加附魔</button></div><div class="card w8"><h3>已应用效果</h3><div class="table"><div class="tr head"><span>类型</span><span>名称</span><span>值</span><span>槽位</span></div><div class="tr"><span class="tag">属性</span><span>攻击伤害</span><span>+5</span><span>主手</span></div><div class="tr"><span class="tag gold">附魔</span><span>锋利</span><span>V</span><span>—</span></div></div></div><div class="card w4"><h3>耐久</h3>'+inp('耐久度','100%')+'<button class="btn primary" style="width:100%">应用增强</button></div></div>');
if(i===8)c.innerHTML=base('高级设置','低频设置放到最后，不干扰主工作流','<div class="grid"><div class="card w6"><h3>界面</h3>'+inp('缩放','自动')+inp('主题','Minecraft Dark')+'</div><div class="card w6"><h3>兼容</h3>'+inp('JEI','已启用')+inp('Mekanism','自动检测')+inp('AE2','自动检测')+'</div></div>');
}function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;right:25px;bottom:25px;background:#26362b;border:1px solid #609a70;color:#c5ecd0;padding:9px 13px;border-radius:5px;z-index:5';document.body.appendChild(x);setTimeout(()=>x.remove(),1300)}show(0);
</script></html>
